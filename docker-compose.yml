version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: teslo-shop-db
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: teslo-shop
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
